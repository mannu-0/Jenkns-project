<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Driving Mini Game</title>

<style>
    body {
        margin: 0;
        background: #222;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial;
    }

    #game {
        width: 300px;
        height: 500px;
        background: #555;
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        border: 3px solid white;
    }

    .line {
        width: 10px;
        height: 80px;
        background: white;
        position: absolute;
        left: 145px;
        animation: moveLines 1s linear infinite;
    }

    @keyframes moveLines {
        from { top: -100px; }
        to { top: 500px; }
    }

    #car {
        width: 50px;
        height: 80px;
        background: red;
        position: absolute;
        bottom: 20px;
        left: 125px;
        border-radius: 5px;
    }

    .enemy {
        width: 50px;
        height: 80px;
        background: yellow;
        position: absolute;
        top: -100px;
        border-radius: 5px;
        animation: moveEnemy 2s linear infinite;
    }

    @keyframes moveEnemy {
        from { top: -100px; }
        to { top: 600px; }
    }
</style>
</head>
<body>

<div id="game">
    <div class="line" style="top:0"></div>
    <div class="line" style="top:150px"></div>
    <div class="line" style="top:300px"></div>
    <div class="line" style="top:450px"></div>

    <div id="car"></div>
    <div class="enemy" id="enemy"></div>
</div>

<script>
    let car = document.getElementById("car");
    let enemy = document.getElementById("enemy");
    let roadWidth = 250;

    // Enemy start position
    function resetEnemy() {
        enemy.style.top = "-100px";
        enemy.style.left = Math.floor(Math.random() * 250) + "px";
    }

    resetEnemy();

    document.addEventListener("keydown", function (e) {
        let carLeft = parseInt(window.getComputedStyle(car).getPropertyValue("left"));

        if (e.key === "ArrowLeft" && carLeft > 0) {
            car.style.left = (carLeft - 20) + "px";
        }
        else if (e.key === "ArrowRight" && carLeft < roadWidth) {
            car.style.left = (carLeft + 20) + "px";
        }
    });

    // Collision check
    setInterval(function () {
        let carLeft = parseInt(window.getComputedStyle(car).getPropertyValue("left"));
        let carTop = parseInt(window.getComputedStyle(car).getPropertyValue("top"));

        let enemyLeft = parseInt(window.getComputedStyle(enemy).getPropertyValue("left"));
        let enemyTop = parseInt(window.getComputedStyle(enemy).getPropertyValue("top"));

        if (enemyTop > 450) resetEnemy();

        // Collision logic
        if (
            enemyTop > 350 &&
            enemyTop < 500 &&
            Math.abs(carLeft - enemyLeft) < 50
        ) {
            alert("💥 Crash! Game Over!");
            location.reload();
        }
    }, 10);
</script>

</body>
</html>
