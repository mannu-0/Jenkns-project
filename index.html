<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Game with Sound + Car Selection</title>

<style>
    body {
        margin: 0;
        background: #222;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        user-select: none;
    }

    #menu {
        background: #333;
        padding: 30px;
        border-radius: 15px;
        color: white;
        text-align: center;
        box-shadow: 0 0 20px #000;
    }

    .car-preview {
        width: 60px;
        height: 100px;
        margin: 15px;
        border-radius: 10px;
        display: inline-block;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 10px #0008;
    }

    .car-preview:hover {
        transform: scale(1.1);
    }

    #startBtn {
        padding: 10px 20px;
        margin-top: 20px;
        background: lime;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
    }

    /* GAME AREA */
    #game {
        width: 350px;
        height: 600px;
        background: #555;
        position: relative;
        overflow: hidden;
        border-radius: 15px;
        display: none;
        border: 5px solid white;
        box-shadow: 0 0 20px #000c;
    }

    #car {
        width: 55px;
        height: 90px;
        position: absolute;
        bottom: 20px;
        left: 150px;
        border-radius: 10px;
        box-shadow: 0 5px 15px #0008;
    }

    .enemy {
        width: 55px;
        height: 90px;
        background: linear-gradient(#ffe066, #d4b200);
        position: absolute;
        top: -150px;
        border-radius: 10px;
        box-shadow: 0 5px 15px #0009;
        animation: moveEnemy 2.5s linear infinite;
    }

    @keyframes moveEnemy {
        from { top: -150px; }
        to { top: 650px; }
    }

    .road-line {
        width: 10px;
        height: 80px;
        background: white;
        position: absolute;
        left: 170px;
        opacity: 0.8;
        animation: roadMove 1s linear infinite;
    }

    @keyframes roadMove {
        0% { top: -100px; }
        100% { top: 650px; }
    }

    #score {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #0008;
        color: white;
        padding: 10px 15px;
        border-radius: 10px;
        font-size: 22px;
    }
</style>
</head>
<body>

<!-- CAR SELECTION MENU -->
<div id="menu">
    <h2>Select Your Car</h2>

    <div id="cars">
        <div class="car-preview" style="background: linear-gradient(#ff4444,#cc0000)" data-color="red"></div>
        <div class="car-preview" style="background: linear-gradient(#00aaff,#005f8a)" data-color="blue"></div>
        <div class="car-preview" style="background: linear-gradient(#33ff33,#00aa00)" data-color="green"></div>
        <div class="car-preview" style="background: linear-gradient(#ffa500,#cc8400)" data-color="orange"></div>
    </div>

    <button id="startBtn">START GAME</button>
</div>

<!-- GAME AREA -->
<div id="game">
    <div id="score">Score: 0</div>

    <div class="road-line" style="top:0"></div>
    <div class="road-line" style="top:150px"></div>
    <div class="road-line" style="top:300px"></div>
    <div class="road-line" style="top:450px"></div>

    <div id="car"></div>
    <div class="enemy" id="enemy1"></div>
    <div class="enemy" id="enemy2"></div>
</div>

<!-- SOUND EFFECTS -->
<audio id="engine" loop>
<source src="data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAACAAACcQCAgICAgICAgP//AACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" type="audio/mp3">
</audio>

<audio id="crash">
<source src="data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZm8AAAA8AAAAAgAAAnEAgICAgICAgP//AACAgICAgICAgICAgICAgICAgICAg" type="audio/mp3">
</audio>

<audio id="scoreSound">
<source src="data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZm8AAAA8AAAAAgAAAnEAgICAgICAgICAgP//AACAgICAgICAg" type="audio/mp3">
</audio>

<script>
let selectedColor = "red";
let menu = document.getElementById("menu");
let game = document.getElementById("game");
let car = document.getElementById("car");

document.querySelectorAll(".car-preview").forEach(c => {
    c.onclick = () => {
        selectedColor = c.getAttribute("data-color");
        [...document.querySelectorAll(".car-preview")].forEach(x => x.style.border = "none");
        c.style.border = "3px solid yellow";
    };
});

document.getElementById("startBtn").onclick = () => {
    menu.style.display = "none";
    game.style.display = "block";

    // Apply selected car color
    if (selectedColor == "red") car.style.background = "linear-gradient(#ff4444,#cc0000)";
    if (selectedColor == "blue") car.style.background = "linear-gradient(#00aaff,#005f8a)";
    if (selectedColor == "green") car.style.background = "linear-gradient(#33ff33,#00aa00)";
    if (selectedColor == "orange") car.style.background = "linear-gradient(#ffa500,#cc8400)";

    document.getElementById("engine").play(); // start engine sound
    startGame();
};

let enemy1 = document.getElementById("enemy1");
let enemy2 = document.getElementById("enemy2");
let scoreBox = document.getElementById("score");

let score = 0;
let speed = 2;

function randomPos(enemy) {
    enemy.style.top = "-150px";
    enemy.style.left = (50 + Math.random() * 200) + "px";
}

randomPos(enemy1);
randomPos(enemy2);

function startGame() {
    setInterval(() => {
        score++;
        scoreBox.innerHTML = "Score: " + score;
        speed += 0.003;

        moveEnemy(enemy1);
        moveEnemy(enemy2);
    }, 20);
}

function moveEnemy(enemy) {
    let t = parseInt(getComputedStyle(enemy).top);
    enemy.style.top = t + speed + "px";

    if (t > 600) {
        randomPos(enemy);
        document.getElementById("scoreSound").play(); // score sound
    }

    detectCrash(enemy);
}

document.addEventListener("keydown", e => {
    let left = parseInt(getComputedStyle(car).left);

    if (e.key === "ArrowLeft" && left > 50) car.style.left = left - 20 + "px";
    if (e.key === "ArrowRight" && left < 300 - 55) car.style.left = left + 20 + "px";
});

function detectCrash(enemy) {
    let carLeft = parseInt(getComputedStyle(car).left);
    let carTop = 480;

    let enemyLeft = parseInt(getComputedStyle(enemy).left);
    let enemyTop = parseInt(getComputedStyle(enemy).top);

    if (enemyTop + 90 > carTop - 80 &&
        enemyTop < carTop &&
        Math.abs(carLeft - enemyLeft) < 50) {

        document.getElementById("engine").pause();
        document.getElementById("crash").play();

        alert("💥 Crash! GAME OVER!\nScore: " + score);
        location.reload();
    }
}
</script>

</body>
</html>
