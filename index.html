<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Click Game</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #111;
        color: white;
        font-family: Arial;
        flex-direction: column;
    }

    #circle {
        width: 80px;
        height: 80px;
        background: #ff4d4d;
        border-radius: 50%;
        cursor: pointer;
        transition: 0.2s;
    }

    #circle:hover {
        transform: scale(1.2);
        background: #ff1a1a;
    }

    #score {
        margin-top: 20px;
        font-size: 24px;
    }
</style>
</head>
<body>

<div id="circle"></div>
<div id="score">Score: 0</div>

<script>
    let score = 0;

    document.getElementById("circle").onclick = function () {
        score++;
        document.getElementById("score").innerText = "Score: " + score;

        // Random move
        this.style.marginTop = (Math.random() * 200) + "px";
        this.style.marginLeft = (Math.random() * 200) + "px";
    };
</script>

</body>
</html>
