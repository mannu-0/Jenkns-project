<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Game - Better Graphics</title>

<style>
    body {
        margin: 0;
        background: #2b2b2b;
        display: flex;
        justify-content: center;
        padding-top: 10px;
        font-family: Arial;
        user-select: none;
    }

    #game {
        width: 350px;
        height: 600px;
        background: #333;
        position: relative;
        overflow: hidden;
        border-radius: 15px;
        border: 5px solid #fff;
        box-shadow: 0 0 20px #000b;
    }

    /* Road + Grass */
    #left-grass, #right-grass {
        width: 50px;
        height: 100%;
        background: linear-gradient(45deg, #0f0, #070);
        position: absolute;
        top: 0;
    }

    #left-grass { left: 0; }
    #right-grass { right: 0; }

    #road {
        position: absolute;
        left: 50px;
        width: 250px;
        height: 100%;
        background: #555;
        border-left: 6px dashed #eee;
        border-right: 6px dashed #eee;
        background-size: 20px 20px;
    }

    .line {
        width: 10px;
        height: 80px;
        background: white;
        position: absolute;
        left: 170px;
        opacity: 0.8;
        animation: roadMove 1s linear infinite;
    }

    @keyframes roadMove {
        0% { top: -100px; }
        100% { top: 650px; }
    }

    /* Player car */
    #car {
        width: 55px;
        height: 90px;
        background: red;
        position: absolute;
        bottom: 20px;
        left: 150px;
        border-radius: 10px;
        box-shadow: 0 5px 15px #0007;
        background: linear-gradient(#ff4444, #cc0000);
    }

    /* Enemy cars */
    .enemy {
        width: 55px;
        height: 90px;
        position: absolute;
        top: -100px;
        border-radius: 10px;
        box-shadow: 0 5px 15px #0008;
        background: linear-gradient(#ffe066, #d4b200);
        animation: enemyMove 2.5s linear infinite;
    }

    @keyframes enemyMove {
        0% { top: -150px; }
        100% { top: 700px; }
    }

    #score {
        color: white;
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 10px 15px;
        background: #0008;
        border-radius: 10px;
        font-size: 20px;
    }
</style>
</head>
<body>

<div id="game">

    <div id="left-grass"></div>
    <div id="right-grass"></div>
    <div id="road"></div>

    <div class="line" style="top:0"></div>
    <div class="line" style="top:150px"></div>
    <div class="line" style="top:300px"></div>
    <div class="line" style="top:450px"></div>

    <div id="score">Score: 0</div>

    <div id="car"></div>

    <div class="enemy" id="enemy1"></div>
    <div class="enemy" id="enemy2"></div>

</div>

<script>
    let car = document.getElementById("car");
    let scoreBox = document.getElementById("score");
    let enemy1 = document.getElementById("enemy1");
    let enemy2 = document.getElementById("enemy2");

    let roadLeft = 50;
    let roadWidth = 250;

    let score = 0;
    let speed = 2;
    
    function randomEnemyPosition(enemy) {
        enemy.style.top = "-200px";
        enemy.style.left = (50 + Math.floor(Math.random() * 200)) + "px";
    }

    randomEnemyPosition(enemy1);
    randomEnemyPosition(enemy2);

    document.addEventListener("keydown", function (e) {
        let carLeft = parseInt(getComputedStyle(car).left);

        if (e.key === "ArrowLeft" && carLeft > roadLeft) {
            car.style.left = (carLeft - 20) + "px";
        }
        if (e.key === "ArrowRight" && carLeft < roadLeft + roadWidth - 55) {
            car.style.left = (carLeft + 20) + "px";
        }
    });

    // Main game loop
    setInterval(() => {
        score++;
        scoreBox.innerHTML = "Score: " + score;

        speed += 0.002; // auto speed increase

        moveEnemy(enemy1);
        moveEnemy(enemy2);
    }, 20);

    function moveEnemy(enemy) {
        let top = parseInt(getComputedStyle(enemy).top);
        enemy.style.top = top + speed + "px";

        if (top > 600) randomEnemyPosition(enemy);

        collisionCheck(enemy);
    }

    function collisionCheck(enemy) {
        let carLeft = parseInt(getComputedStyle(car).left);
        let carTop = parseInt(getComputedStyle(car).top) + 480;

        let enemyLeft = parseInt(getComputedStyle(enemy).left);
        let enemyTop = parseInt(getComputedStyle(enemy).top);

        if (
            enemyTop + 90 > carTop - 80 &&
            enemyTop < carTop &&
            Math.abs(carLeft - enemyLeft) < 50
        ) {
            alert("💥 Crash! Game Over!\nScore: " + score);
            location.reload();
        }
    }
</script>

</body>
</html>
