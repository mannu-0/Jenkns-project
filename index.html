<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Beautiful Card</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            width: 280px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: fadeIn 1.2s ease-in-out;
        }
        .card h2 {
            margin: 0;
            color: #333;
        }
        .card p {
            color: #555;
            margin: 10px 0 20px;
        }
        .btn {
            padding: 10px 18px;
            background: #2575fc;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Hello 👋</h2>
        <p>This is a simple & beautiful HTML card UI.</p>
        <a href="#" class="btn">Click Me</a>
    </div>

</body>
</html>
